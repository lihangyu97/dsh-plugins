# 每轮对话回答结束后弹一条系统通知。
#
# 页面开着时由浏览器端（client.js）发原生通知：归属就是 DeepSeek Harness，
# 不占程序坞、不拉 Script Editor，并且点击通知会跳回对应会话。
# 页面关掉时由 Host 端兜底：优先用 terminal-notifier（装了的话），否则用
# osascript（macOS 会经 Script Editor 投递，本插件会在弹完后退出它）。
#
# 这一层的 config 就是插件的全部可调项，改完由 Loader 热重载，重启后依旧生效。
- insert:
    - id: turn-notify
      name: '@local/dsh-turn-notify'
      config:
        # 总开关。false 时插件激活但不注册任何监听。
        enabled: true
        # Host 兜底通知的标题（页内通知的标题是会话标题，系统会自己显示应用名）。
        title: DeepSeek Harness
        # 静音。
        silent: false
        # 提示音名，例如 Glass / Ping / Hero / Submarine；留空 = 无声（terminal-notifier 走 default）。
        sound: ''
        # 会话标题最大字符数。
        maxTopicChars: 80
        # 回答摘要最大字符数。
        maxBodyChars: 140
        # 跳过子代理会话（subagent / workflow 子会话），否则一次任务会弹很多条。
        skipSubagents: true
        # 只提醒正常结束的轮次；true 时用户中断、报错、达到长度上限都不提醒。
        onlyCompleted: false
        # Host 兜底用哪个通知器：auto（有 terminal-notifier 就用它）/ osascript / terminal-notifier。
        notifier: auto
        # 指定 terminal-notifier 可执行文件路径；留空则自动探测 brew 安装位置。
        terminalNotifierPath: ''
        # osascript 兜底弹完后是否退出 Script Editor（防止它常驻程序坞，延迟 4 秒执行）。
        quitScriptEditor: true
